
name: TV Brasil - Sincronização diária

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-brasil-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar sincronizador
        run: python scripts/sync_sources.py

      - name: Salvar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog.json reports/sync-report.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática do catálogo"
            git push
          else
            echo "Nenhuma alteração no catálogo."
          fi
          
