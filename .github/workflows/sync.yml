name: TV Brasil - Sincronização e validação

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-brasil-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sincronizar canais
        run: python scripts/sync_sources.py

      - name: Validar transmissões
        run: python scripts/validate_streams.py

      - name: Validar playlists HLS e segmentos
        run: python scripts/validate_hls.py

      - name: Consolidar catálogo final para o PWA
        run: python scripts/build_final_catalog.py

      - name: Salvar catálogos e relatórios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ reports/

          if ! git diff --cached --quiet; then
            git commit -m "Atualização e validação dos canais"
            git push
          else
            echo "Nenhuma alteração encontrada."
          fi
          
